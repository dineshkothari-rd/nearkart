services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nearkart}
      POSTGRES_USER: ${POSTGRES_USER:-nearkart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nearkart_dev}
    ports:
      - "5432:5432"
    volumes:
      - nearkart-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nearkart-postgres:
